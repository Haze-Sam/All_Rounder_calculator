<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Tool Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg0: #06060f;
      --bg1: #0d0d1e;
      --glass: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.10);
      --glass-hover: rgba(255,255,255,0.08);
      --text: #f0eeff;
      --text-muted: rgba(240,238,255,0.5);
      --text-dim: rgba(240,238,255,0.28);
      --accent: #a78bfa;
      --accent2: #38bdf8;
      --accent3: #f472b6;
      --accent-glow: rgba(167,139,250,0.35);
      --accent2-glow: rgba(56,189,248,0.3);
      --accent3-glow: rgba(244,114,182,0.35);
      --radius: 18px;
      --radius-sm: 10px;
      --font-display: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-display);
      background: var(--bg0);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2.5rem 1rem 4rem;
      overflow-x: hidden;
    }

    /* Animated background orbs */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: drift linear infinite;
    }
    .orb1 { width: 600px; height: 600px; background: var(--accent); top: -15%; left: -10%; animation-duration: 28s; }
    .orb2 { width: 500px; height: 500px; background: var(--accent2); bottom: -10%; right: -5%; animation-duration: 34s; animation-direction: reverse; }
    .orb3 { width: 400px; height: 400px; background: var(--accent3); top: 40%; left: 50%; animation-duration: 22s; animation-delay: -8s; }

    @keyframes drift {
      0%   { transform: translate(0,0) scale(1); }
      33%  { transform: translate(40px,-30px) scale(1.05); }
      66%  { transform: translate(-20px,40px) scale(0.96); }
      100% { transform: translate(0,0) scale(1); }
    }

    /* Grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.025;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      width: 100%;
      max-width: 580px;
      position: relative;
      z-index: 2;
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    .site-header {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeUp 0.7s 0.1s cubic-bezier(0.22,1,0.36,1) both;
    }

    .logo-ring {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      position: relative;
      box-shadow: 0 0 40px var(--accent-glow);
    }
    .logo-ring i { font-size: 28px; color: var(--accent); }
    .logo-ring::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent), var(--accent2), var(--accent3), var(--accent));
      z-index: -1;
      animation: spin 6s linear infinite;
      opacity: 0.7;
    }
    .logo-ring::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      background: var(--bg0);
      z-index: -1;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .site-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .site-sub { font-size: 13px; color: var(--text-dim); margin-top: 4px; font-weight: 400; letter-spacing: 0.5px; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 1.75rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 5px;
      animation: fadeUp 0.7s 0.15s cubic-bezier(0.22,1,0.36,1) both;
    }

    .tab-btn {
      flex: 1;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
      font-family: var(--font-display);
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .tab-btn i { font-size: 15px; }
    .tab-btn:hover { color: var(--text); }

    .tab-btn.active[data-tab="currency"] {
      background: rgba(167,139,250,0.18);
      color: var(--accent);
      box-shadow: 0 0 20px rgba(167,139,250,0.2), inset 0 0 12px rgba(167,139,250,0.08);
      border-color: rgba(167,139,250,0.3);
    }
    .tab-btn.active[data-tab="calc"] {
      background: rgba(56,189,248,0.15);
      color: var(--accent2);
      box-shadow: 0 0 20px rgba(56,189,248,0.2), inset 0 0 12px rgba(56,189,248,0.06);
      border-color: rgba(56,189,248,0.3);
    }
    .tab-btn.active[data-tab="love"] {
      background: rgba(244,114,182,0.15);
      color: var(--accent3);
      box-shadow: 0 0 20px rgba(244,114,182,0.2), inset 0 0 12px rgba(244,114,182,0.06);
      border-color: rgba(244,114,182,0.3);
    }

    /* Panel */
    .panel { display: none; animation: panelIn 0.4s cubic-bezier(0.22,1,0.36,1) both; }
    .panel.active { display: block; }
    @keyframes panelIn { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }

    /* Glass card */
    .card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 1.75rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    }

    /* Currency */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 1.25rem;
    }
    .card-title { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.2px; }

    .rate-badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(74,222,128,0.1);
      color: #4ade80;
      border: 1px solid rgba(74,222,128,0.25);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
    }
    .rate-badge i { font-size: 10px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .fx-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .fx-col { display: flex; flex-direction: column; gap: 7px; flex: 1; min-width: 120px; }
    .fx-col label { font-size: 11px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; }

    .fx-col input, .fx-col select {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 15px;
      font-family: var(--font-mono);
      width: 100%;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      -webkit-appearance: none;
    }
    .fx-col input:focus, .fx-col select:focus {
      border-color: rgba(167,139,250,0.5);
      background: rgba(167,139,250,0.06);
      box-shadow: 0 0 0 3px rgba(167,139,250,0.12);
    }
    .fx-col select option { background: #111; color: var(--text); }

    .swap-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-hover);
      cursor: pointer;
      color: var(--text-muted);
      align-self: flex-end;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
    }
    .swap-btn:hover {
      color: var(--accent);
      border-color: rgba(167,139,250,0.4);
      box-shadow: 0 0 16px var(--accent-glow);
      transform: rotate(180deg);
    }

    .result-box {
      margin-top: 1.25rem;
      padding: 1.25rem 1.5rem;
      background: linear-gradient(135deg, rgba(167,139,250,0.08), rgba(56,189,248,0.06));
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: var(--radius-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .result-amount { font-size: 34px; font-weight: 700; color: var(--text); font-family: var(--font-mono); letter-spacing: -1px; line-height: 1; }
    .result-label { font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); margin-top: 4px; }
    .rate-display { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); text-align: right; line-height: 1.6; }
    .rate-info { font-size: 11px; color: var(--text-dim); margin-top: 10px; font-family: var(--font-mono); }

    /* Calculator */
    .calc-wrap { max-width: 340px; margin: 0 auto; }

    .calc-display {
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 18px 20px;
      text-align: right;
      margin-bottom: 14px;
      min-height: 80px;
      position: relative;
      overflow: hidden;
    }
    .calc-display::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(56,189,248,0.3), transparent);
    }

    .calc-expr { font-size: 13px; color: var(--text-dim); font-family: var(--font-mono); min-height: 18px; word-break: break-all; }
    .calc-result { font-size: 36px; font-weight: 500; font-family: var(--font-mono); color: var(--text); word-break: break-all; letter-spacing: -1px; }

    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

    .calc-key {
      padding: 16px 4px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font-display);
      transition: all 0.15s cubic-bezier(0.22,1,0.36,1);
      text-align: center;
    }
    .calc-key:hover { background: rgba(255,255,255,0.09); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.35); }
    .calc-key:active { transform: scale(0.93); box-shadow: none; }

    .calc-key.op { color: var(--accent2); border-color: rgba(56,189,248,0.2); background: rgba(56,189,248,0.06); }
    .calc-key.op:hover { background: rgba(56,189,248,0.13); box-shadow: 0 0 18px rgba(56,189,248,0.2); }

    .calc-key.clr { color: var(--accent3); border-color: rgba(244,114,182,0.25); background: rgba(244,114,182,0.06); }
    .calc-key.clr:hover { background: rgba(244,114,182,0.13); box-shadow: 0 0 18px rgba(244,114,182,0.2); }

    .calc-key.eq {
      background: linear-gradient(135deg, var(--accent), #818cf8);
      border-color: transparent;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 0 22px var(--accent-glow);
    }
    .calc-key.eq:hover { box-shadow: 0 0 32px var(--accent-glow), 0 4px 14px rgba(0,0,0,0.4); transform: translateY(-2px); }
    .calc-key.eq:active { transform: scale(0.94); }
    .calc-key.wide { grid-column: span 2; }

    /* Love Meter */
    .love-inputs { display: flex; flex-direction: column; gap: 12px; margin-bottom: 1.5rem; }

    .love-inputs input {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 16px;
      font-family: var(--font-display);
      font-weight: 500;
      text-align: center;
      outline: none;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }
    .love-inputs input::placeholder { color: var(--text-dim); font-weight: 400; }
    .love-inputs input:focus {
      border-color: rgba(244,114,182,0.5);
      background: rgba(244,114,182,0.05);
      box-shadow: 0 0 0 3px rgba(244,114,182,0.12);
    }

    .love-sep {
      text-align: center;
      font-size: 24px;
      color: var(--accent3);
      filter: drop-shadow(0 0 8px var(--accent3-glow));
      animation: heartbeat 1.4s ease-in-out infinite;
    }
    @keyframes heartbeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }

    .love-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-sm);
      border: none;
      background: linear-gradient(135deg, #f472b6, #e879f9, #c084fc);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      font-family: var(--font-display);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
      box-shadow: 0 0 24px rgba(244,114,182,0.35);
      letter-spacing: 0.3px;
    }
    .love-btn:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(244,114,182,0.5), 0 8px 24px rgba(0,0,0,0.3); }
    .love-btn:active { transform: scale(0.97); }

    .meter-wrap { margin-top: 1.5rem; display: none; }
    .meter-names {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .meter-track {
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #f472b6, #e879f9, #c084fc, #a78bfa);
      transition: width 1.2s cubic-bezier(0.34,1.3,0.64,1);
      box-shadow: 0 0 12px rgba(244,114,182,0.6);
    }

    .meter-score { text-align: center; margin-top: 1.5rem; }
    .score-num {
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
      font-family: var(--font-mono);
      background: linear-gradient(135deg, #f472b6, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(244,114,182,0.4));
    }
    .score-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }
    .score-msg {
      margin-top: 1rem;
      padding: 12px 16px;
      background: rgba(244,114,182,0.07);
      border: 1px solid rgba(244,114,182,0.18);
      border-radius: var(--radius-sm);
      font-size: 14px;
      text-align: center;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .hearts { font-size: 28px; letter-spacing: 4px; text-align: center; margin-top: 12px; }

    /* Floating particles */
    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { opacity: 0; transform: translateY(0) scale(0); }
      10%  { opacity: 0.6; transform: translateY(-20px) scale(1); }
      90%  { opacity: 0.15; }
      100% { opacity: 0; transform: translateY(-120px) scale(0.3); }
    }

    @media (max-width: 480px) {
      .fx-row { flex-direction: column; }
      .swap-btn { align-self: center; }
      body { padding: 1.5rem 0.75rem 3rem; }
    }
  </style>
</head>
<body>

  <div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>
  <div class="particles" id="particles"></div>

  <div class="container">

    <div class="site-header">
      <div class="logo-ring">
        <i class="ti ti-infinity"></i>
      </div>
      <div class="site-title">Multi-Tool Hub</div>
      <div class="site-sub">Currency · Calculator · Love Meter</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="currency" onclick="switchTab('currency',this)">
        <i class="ti ti-currency-dollar"></i> Currency
      </button>
      <button class="tab-btn" data-tab="calc" onclick="switchTab('calc',this)">
        <i class="ti ti-calculator"></i> Calculator
      </button>
      <button class="tab-btn" data-tab="love" onclick="switchTab('love',this)">
        <i class="ti ti-heart"></i> Love meter
      </button>
    </div>

    <!-- Currency -->
    <div id="panel-currency" class="panel active">
      <div class="card">
        <div class="card-header">
          <div class="card-title">Live currency converter</div>
          <span class="rate-badge" id="live-badge">
            <i class="ti ti-circle-dot"></i>
            <span id="badge-text">Connecting...</span>
          </span>
        </div>
        <div class="fx-row">
          <div class="fx-col">
            <label>Amount</label>
            <input type="number" id="fx-amount" value="1" min="0" oninput="convertCurrency()" />
          </div>
          <div class="fx-col">
            <label>From</label>
            <select id="fx-from" onchange="convertCurrency()"></select>
          </div>
          <button class="swap-btn" onclick="swapCurrencies()" title="Swap">
            <i class="ti ti-arrows-right-left"></i>
          </button>
          <div class="fx-col">
            <label>To</label>
            <select id="fx-to" onchange="convertCurrency()"></select>
          </div>
        </div>
        <div class="result-box">
          <div>
            <div class="result-label" id="result-from-label">—</div>
            <div class="result-amount" id="fx-result">—</div>
            <div class="result-label" id="result-to-label">—</div>
          </div>
          <div class="rate-display" id="rate-display"></div>
        </div>
        <div class="rate-info" id="rate-timestamp"></div>
      </div>
    </div>

    <!-- Calculator -->
    <div id="panel-calc" class="panel">
      <div class="card">
        <div class="calc-wrap">
          <div class="calc-display">
            <div class="calc-expr" id="calc-expr"></div>
            <div class="calc-result" id="calc-disp">0</div>
          </div>
          <div class="calc-grid">
            <button class="calc-key clr" onclick="calcClear()">AC</button>
            <button class="calc-key op"  onclick="calcSign()">+/−</button>
            <button class="calc-key op"  onclick="calcPercent()">%</button>
            <button class="calc-key op"  onclick="calcOp('÷')">÷</button>
            <button class="calc-key"     onclick="calcNum('7')">7</button>
            <button class="calc-key"     onclick="calcNum('8')">8</button>
            <button class="calc-key"     onclick="calcNum('9')">9</button>
            <button class="calc-key op"  onclick="calcOp('×')">×</button>
            <button class="calc-key"     onclick="calcNum('4')">4</button>
            <button class="calc-key"     onclick="calcNum('5')">5</button>
            <button class="calc-key"     onclick="calcNum('6')">6</button>
            <button class="calc-key op"  onclick="calcOp('−')">−</button>
            <button class="calc-key"     onclick="calcNum('1')">1</button>
            <button class="calc-key"     onclick="calcNum('2')">2</button>
            <button class="calc-key"     onclick="calcNum('3')">3</button>
            <button class="calc-key op"  onclick="calcOp('+')">+</button>
            <button class="calc-key wide" onclick="calcNum('0')">0</button>
            <button class="calc-key"     onclick="calcDot()">.</button>
            <button class="calc-key eq"  onclick="calcEquals()">=</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Love Meter -->
    <div id="panel-love" class="panel">
      <div class="card">
        <div class="love-inputs">
          <input type="text" id="name1" placeholder="✦ Your name" maxlength="40" />
          <div class="love-sep">❤️</div>
          <input type="text" id="name2" placeholder="✦ Their name" maxlength="40" />
        </div>
        <button class="love-btn" onclick="calcLove()">
          <i class="ti ti-sparkles"></i> Calculate compatibility
        </button>
        <div class="meter-wrap" id="meter-wrap">
          <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(244,114,182,0.25),transparent);margin:1.25rem 0;"></div>
          <div class="meter-names">
            <span id="m-name1">—</span>
            <span id="m-name2">—</span>
          </div>
          <div class="meter-track">
            <div class="meter-fill" id="meter-fill"></div>
          </div>
          <div class="meter-score">
            <div class="score-num" id="score-num">—</div>
            <div class="score-label">compatibility score</div>
            <div class="score-msg" id="score-msg"></div>
            <div class="hearts" id="hearts-row"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    /* Particles */
    const pCont = document.getElementById('particles');
    const colors = ['#a78bfa','#38bdf8','#f472b6'];
    for (let i=0;i<20;i++) {
      const p=document.createElement('div');
      p.className='particle';
      const size=1+Math.random()*2;
      p.style.cssText=`left:${Math.random()*100}%;bottom:${Math.random()*40}%;width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*3)]};animation-duration:${7+Math.random()*10}s;animation-delay:${-Math.random()*14}s;`;
      pCont.appendChild(p);
    }

    /* Tab switching */
    function switchTab(name,btn) {
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById('panel-'+name).classList.add('active');
      btn.classList.add('active');
    }

    /* Currency */
    const CURRENCIES=[['USD','US Dollar'],['EUR','Euro'],['GBP','British Pound'],['JPY','Japanese Yen'],['AUD','Australian Dollar'],['CAD','Canadian Dollar'],['CHF','Swiss Franc'],['CNY','Chinese Yuan'],['INR','Indian Rupee'],['MXN','Mexican Peso'],['BRL','Brazilian Real'],['KRW','South Korean Won'],['SGD','Singapore Dollar'],['HKD','Hong Kong Dollar'],['NOK','Norwegian Krone'],['SEK','Swedish Krona'],['DKK','Danish Krone'],['NZD','New Zealand Dollar'],['ZAR','South African Rand'],['RUB','Russian Ruble'],['TRY','Turkish Lira'],['AED','UAE Dirham'],['SAR','Saudi Riyal'],['THB','Thai Baht'],['IDR','Indonesian Rupiah'],['MYR','Malaysian Ringgit'],['PHP','Philippine Peso'],['PLN','Polish Zloty'],['CZK','Czech Koruna'],['HUF','Hungarian Forint']];

    let rates={}, ratesLoaded=false;
    const fromSel=document.getElementById('fx-from'), toSel=document.getElementById('fx-to');
    CURRENCIES.forEach(([code,name])=>{
      [fromSel,toSel].forEach(sel=>{ const o=document.createElement('option'); o.value=code; o.textContent=`${code} — ${name}`; sel.appendChild(o); });
    });
    fromSel.value='USD'; toSel.value='EUR';

    async function fetchRates(){
      try {
        const res=await fetch('https://api.exchangerate-api.com/v4/latest/USD');
        if(!res.ok) throw new Error();
        const data=await res.json();
        rates=data.rates; ratesLoaded=true;
        const ts=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        document.getElementById('badge-text').textContent='Live · '+ts;
        document.getElementById('rate-timestamp').textContent='↻ via exchangerate-api.com · auto-refreshes every 30 min';
        convertCurrency();
      } catch(e) {
        document.getElementById('badge-text').textContent='Offline · fallback';
        const badge=document.getElementById('live-badge');
        badge.style.background='rgba(248,113,113,0.1)'; badge.style.color='#f87171'; badge.style.borderColor='rgba(248,113,113,0.25)';
        rates={USD:1,EUR:0.92,GBP:0.79,JPY:149.5,AUD:1.52,CAD:1.36,CHF:0.90,CNY:7.24,INR:83.1,MXN:17.2,BRL:4.97,KRW:1325,SGD:1.34,HKD:7.82,NOK:10.6,SEK:10.4,DKK:6.88,NZD:1.63,ZAR:18.6,RUB:89.5,TRY:30.7,AED:3.67,SAR:3.75,THB:35.1,IDR:15600,MYR:4.67,PHP:56.5,PLN:4.01,CZK:22.6,HUF:356};
        ratesLoaded=true; convertCurrency();
      }
    }

    function convertCurrency(){
      if(!ratesLoaded) return;
      const amount=parseFloat(document.getElementById('fx-amount').value)||0;
      const from=fromSel.value, to=toSel.value;
      const result=(amount/(rates[from]||1))*(rates[to]||1);
      document.getElementById('fx-result').textContent=result.toLocaleString('en-US',{maximumFractionDigits:result<1?6:2});
      document.getElementById('result-from-label').textContent=`${amount.toLocaleString()} ${from} =`;
      document.getElementById('result-to-label').textContent=to;
      const unit=(1/(rates[from]||1))*(rates[to]||1);
      document.getElementById('rate-display').innerHTML=`1 ${from}<br>= ${unit.toFixed(4)} ${to}`;
    }

    function swapCurrencies(){
      const tmp=fromSel.value; fromSel.value=toSel.value; toSel.value=tmp; convertCurrency();
    }

    setInterval(fetchRates,30*60*1000);
    fetchRates();

    /* Calculator */
    let cExpr='',cCurrent='0',cNewNum=true,cLastOp='',cResult=null;
    function dispUpdate(){ document.getElementById('calc-disp').textContent=cCurrent; document.getElementById('calc-expr').textContent=cExpr; }
    function calcNum(n){ if(cNewNum){cCurrent=n;cNewNum=false;}else cCurrent=cCurrent==='0'?n:cCurrent+n; dispUpdate(); }
    function calcDot(){ if(cNewNum){cCurrent='0.';cNewNum=false;}else if(!cCurrent.includes('.'))cCurrent+='.'; dispUpdate(); }
    function calcOp(op){ if(!cNewNum)computePending(); cResult=parseFloat(cCurrent);cExpr=cCurrent+' '+op;cLastOp=op;cNewNum=true; dispUpdate(); }
    function computePending(){
      if(!cLastOp||cResult===null) return;
      const b=parseFloat(cCurrent);
      let r;
      if(cLastOp==='+')r=cResult+b; else if(cLastOp==='−')r=cResult-b; else if(cLastOp==='×')r=cResult*b; else if(cLastOp==='÷')r=b!==0?cResult/b:NaN;
      cExpr+=' '+cCurrent+' =';
      cCurrent=isNaN(r)?'Error':parseFloat(r.toPrecision(12)).toString();
      cResult=null;cLastOp='';cNewNum=true;
    }
    function calcEquals(){ computePending(); dispUpdate(); }
    function calcClear(){ cExpr='';cCurrent='0';cNewNum=true;cLastOp='';cResult=null; dispUpdate(); }
    function calcSign(){ cCurrent=(parseFloat(cCurrent)*-1).toString(); dispUpdate(); }
    function calcPercent(){ cCurrent=(parseFloat(cCurrent)/100).toString(); dispUpdate(); }

    document.addEventListener('keydown',e=>{
      if(!document.getElementById('panel-calc').classList.contains('active')) return;
      if(document.activeElement.tagName==='INPUT') return;
      if(e.key>='0'&&e.key<='9') calcNum(e.key);
      else if(e.key==='.') calcDot();
      else if(e.key==='+') calcOp('+');
      else if(e.key==='-') calcOp('−');
      else if(e.key==='*') calcOp('×');
      else if(e.key==='/'){ e.preventDefault(); calcOp('÷'); }
      else if(e.key==='Enter'||e.key==='=') calcEquals();
      else if(e.key==='Backspace'){ if(cCurrent.length>1)cCurrent=cCurrent.slice(0,-1);else cCurrent='0'; dispUpdate(); }
      else if(e.key==='Escape') calcClear();
      else if(e.key==='%') calcPercent();
    });

    /* Love Meter */
    function calcLove(){
      const n1=document.getElementById('name1').value.trim();
      const n2=document.getElementById('name2').value.trim();
      if(!n1||!n2){ alert('Please enter both names! 💝'); return; }
      const combined=(n1+n2).toUpperCase().replace(/\s/g,'');
      let hash=0;
      for(let i=0;i<combined.length;i++){ hash=((hash<<5)-hash)+combined.charCodeAt(i); hash|=0; }
      const score=Math.abs(hash)%101;
      document.getElementById('m-name1').textContent=n1;
      document.getElementById('m-name2').textContent=n2;
      document.getElementById('score-num').textContent=score+'%';
      const fill=document.getElementById('meter-fill');
      const wrap=document.getElementById('meter-wrap');
      wrap.style.display='block'; fill.style.width='0%';
      setTimeout(()=>{ fill.style.width=score+'%'; },50);
      let msg,hearts;
      if(score>=90)      { msg='💫 A rare, cosmic connection — you two are written in the stars!'; hearts='❤️❤️❤️❤️❤️'; }
      else if(score>=75) { msg='🔥 Strong chemistry! This could be something really special.'; hearts='❤️❤️❤️❤️'; }
      else if(score>=55) { msg='😊 Good compatibility — with effort, this can blossom beautifully.'; hearts='❤️❤️❤️'; }
      else if(score>=35) { msg='🌱 Potential is there! Take it slow and see where it goes.'; hearts='❤️❤️'; }
      else               { msg='🤷 Opposites attract sometimes... or maybe just great friends?'; hearts='❤️'; }
      document.getElementById('score-msg').textContent=msg;
      document.getElementById('hearts-row').textContent=hearts;
    }

    document.getElementById('name2').addEventListener('keydown',e=>{ if(e.key==='Enter') calcLove(); });
  </script>
</body>
</html>
